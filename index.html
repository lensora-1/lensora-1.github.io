<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a09">
  <meta name="description" content="LENSORA — مساحة تجمع المصورين وصناع المحتوى البصري.">
  <title>LENSORA — Create · Capture · Inspire</title>
  <style>
    :root{color-scheme:dark;--bg:#090a09;--panel:#121512;--line:#34372f;--gold:#c9a45e;--cream:#ead5a6;--muted:#a0a49b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#292316 0,transparent 48%),var(--bg);color:#f4f1e9;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(620px,100%);text-align:center;border:1px solid #80663a;background:linear-gradient(145deg,#171912eF,var(--panel));padding:clamp(28px,7vw,58px);box-shadow:0 24px 80px #0008}
    .lens{width:68px;height:68px;border:1px solid var(--gold);border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;position:relative}
    .lens:before{content:"";width:38px;height:38px;border:1px solid var(--cream);border-radius:50%}.lens:after{content:"";position:absolute;width:9px;height:9px;background:var(--gold);border-radius:50%;box-shadow:0 0 18px var(--gold)}
    .brand{font:800 28px Arial,sans-serif;letter-spacing:5px;color:var(--cream)}.tag{font:11px Arial,sans-serif;letter-spacing:3px;color:var(--gold);margin:12px 0 30px}
    h1{font-size:clamp(23px,5vw,32px);margin:0 0 14px}p{color:var(--muted);line-height:1.9;margin:0 auto 26px}
    a{display:inline-block;background:var(--gold);color:#17140d;text-decoration:none;font-weight:bold;padding:14px 25px;border-radius:4px}
    a:hover{background:var(--cream)}small{display:block;color:#777d72;margin-top:24px;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="lens" aria-hidden="true"></div>
    <div class="brand">LENSORA</div>
    <div class="tag">CREATE · CAPTURE · INSPIRE</div>
    <h1>مساحة تجمع المبدعين البصريين</h1>
    <p>اكتشف المصورين وصنّاع المحتوى، تصفّح الأعمال، وأنشئ ملفك الإبداعي على LENSORA.</p>
    <a href="https://lensora-platform.m7njordan.workers.dev/">الدخول إلى المنصة</a>
    <small>سيتم فتح التطبيق الكامل المستضاف على Cloudflare.</small>
  </main>
</body>
</html>
